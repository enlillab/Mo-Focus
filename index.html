<title>Mo Focus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: calm neutral ground behind layered glass; colour lives only in the timer,controls and data. Floating glass tab bar; timer + side column on wide screens,single column on phones. */
:root{
  --bg:#F2F2F7; --fg:#0B0B10; --fg2:rgba(28,28,40,.62); --fg3:rgba(28,28,40,.34); --sep:rgba(20,20,45,.09);
  --fill:rgba(118,118,140,.13); --fill2:rgba(118,118,140,.22);
  --glass:rgba(255,255,255,.82); --glass-strong:rgba(255,255,255,.92); --glass-edge:rgba(255,255,255,.80);
  --hl:rgba(255,255,255,1); --rim:rgba(0,0,0,.04); --drop:rgba(30,30,60,.08); --sheen:rgba(255,255,255,.55);
  --red:#FF3B30; --green:#34C759; --indigo:#5856D6; --blue:#007AFF; --orange:#FF9500; --pink:#FF2D55; --gray:#8E8E93;
  --b1:#FF6A4D; --b2:#FFB340; --b3:#FF4F8B;
  --phase:var(--red);
  --on-accent:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-round:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-ar:-apple-system,BlinkMacSystemFont,"SF Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r-xl:30px; --r-l:22px; --r-m:16px;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.32); --sep:rgba(255,255,255,.09);
  --fill:rgba(130,130,150,.20); --fill2:rgba(130,130,150,.32);
  --glass:rgba(28,28,32,.92); --glass-strong:rgba(44,44,50,.95); --glass-edge:rgba(255,255,255,.14);
  --hl:rgba(255,255,255,.12); --rim:rgba(255,255,255,.06); --drop:rgba(0,0,0,.45); --sheen:rgba(255,255,255,.10);
  --red:#FF453A; --green:#30D158; --indigo:#5E5CE6; --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.32); --sep:rgba(255,255,255,.09);
  --fill:rgba(130,130,150,.20); --fill2:rgba(130,130,150,.32);
  --glass:rgba(28,28,32,.92); --glass-strong:rgba(44,44,50,.95); --glass-edge:rgba(255,255,255,.14);
  --hl:rgba(255,255,255,.12); --rim:rgba(255,255,255,.06); --drop:rgba(0,0,0,.45); --sheen:rgba(255,255,255,.10);
  --red:#FF453A; --green:#30D158; --indigo:#5E5CE6; --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F;
  color-scheme:dark;
}
:root[data-phase="short"]{--phase:var(--green); --b1:#2FD47A; --b2:#3CC8E0; --b3:#A6E35A}
:root[data-phase="long"]{--phase:var(--indigo); --b1:#6A5CFF; --b2:#3D9BFF; --b3:#C063F5}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.4 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;font-feature-settings:"cv11","ss01"}
:root[lang="ar"] body{font-family:var(--font-ar);letter-spacing:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid color-mix(in srgb,var(--blue) 70%,transparent);outline-offset:2px}

/* Glass material */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 0 var(--hl),inset 0 0 0 1px var(--rim),inset 0 -1px 1px 0 var(--rim),0 12px 40px -8px var(--drop),0 2px 6px -2px var(--drop);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(160deg,var(--sheen) 0%,transparent 34%,transparent 70%,color-mix(in srgb,var(--sheen) 40%,transparent) 100%)}
.glass.strong{background:var(--glass-strong)}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(118px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:650;font-size:1rem;letter-spacing:-.02em}
.brand svg{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:0 2px 8px -2px var(--drop)}
.datechip{font-size:0.7647rem;font-weight:500;color:var(--fg2);padding:7px 12px;border-radius:99px;white-space:nowrap}
.large-title{font-family:var(--font-display);font-size:2rem;font-weight:700;letter-spacing:-.025em;margin:6px 4px 0;line-height:1.12;text-wrap:balance}
.subhead{color:var(--fg2);font-size:0.8824rem;margin:6px 4px 0;max-width:52ch;line-height:1.45}
:root[lang="ar"] .large-title,:root[lang="ar"] .brand{font-family:var(--font-ar);letter-spacing:0}
:root[lang="ar"] .large-title{font-size:1.8824rem;line-height:1.35}

/* Segmented control with sliding lens */
.seg{display:flex;padding:4px;border-radius:99px;position:relative}
.seg button{flex:1;position:relative;z-index:1;font-size:0.8235rem;font-weight:550;padding:9px 10px;border-radius:99px;color:var(--fg2);transition:color .3s var(--ease);white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:650}
.lens{position:absolute;top:4px;bottom:4px;left:0;border-radius:99px;z-index:0;background:var(--glass-strong);
  box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 .5px var(--rim),0 4px 14px -4px var(--drop);transition:transform .45s var(--ease),width .45s var(--ease)}
.seg.phase button[aria-pressed="true"]{color:var(--phase)}

/* Timer */
.dial{position:relative;aspect-ratio:1;border-radius:50%;padding:16px;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.dial .track{stroke:var(--fill)}
.dial .prog{stroke:url(#pg);transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--phase) 55%,transparent))}
.pg1{stop-color:color-mix(in srgb,var(--phase) 70%,#fff);transition:stop-color 1s}
.pg2{stop-color:var(--phase);transition:stop-color 1s}
.knob{fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.phase-pill{font-size:0.7647rem;font-weight:650;color:var(--phase);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:6px;transition:color .6s}
.phase-pill i{width:7px;height:7px;border-radius:50%;background:var(--phase);box-shadow:0 0 0 3px color-mix(in srgb,var(--phase) 22%,transparent)}
.running .phase-pill i{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--phase) 0%,transparent)}}
:root[lang="ar"] .phase-pill{letter-spacing:0;text-transform:none;font-size:0.8824rem}
.clock{direction:ltr;font-family:var(--font-round);font-size:clamp(58px,17vw,84px);font-weight:250;font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1}
.next{font-size:0.8235rem;color:var(--fg2);font-weight:500}
.dial-center .next{max-width:70%;text-align:center;line-height:1.35}
@media (max-width:420px){.dial-center .next{font-size:0.7647rem}}
.controls{display:flex;align-items:flex-start;justify-content:center;gap:20px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctl-label{font-size:0.7059rem;color:var(--fg2);font-weight:500}
.round{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .25s var(--ease)}
.round:active{transform:scale(.9)}
.round svg{width:22px;height:22px}
.primary{position:relative;min-width:168px;height:62px;border-radius:31px;padding:0 30px;color:var(--on-accent);font-size:1.1176rem;font-weight:650;letter-spacing:-.01em;isolation:isolate;
  background:linear-gradient(180deg,color-mix(in srgb,var(--phase) 78%,#fff) 0%,var(--phase) 55%,color-mix(in srgb,var(--phase) 88%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.12),0 10px 26px -6px color-mix(in srgb,var(--phase) 70%,transparent);
  transition:transform .25s var(--ease),box-shadow .4s,background .6s}
.primary::after{content:"";position:absolute;inset:2px 14px auto;height:45%;border-radius:30px 30px 60% 60%;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
.primary:active{transform:scale(.95)}
.primary.paused{color:var(--phase);background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px color-mix(in srgb,var(--phase) 35%,transparent),0 10px 30px -10px var(--drop)}
.primary.paused::after{opacity:.4}
:root[lang="ar"] .primary{letter-spacing:0;font-size:1.0588rem}
.card{border-radius:var(--r-l);padding:16px 18px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h b{font-size:0.8824rem;font-weight:650}
.card-h span{font-size:0.7647rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.task-card{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px}
.task-card .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.task-card .k{font-size:0.7353rem;color:var(--fg2);font-weight:500}
.task-card .v{font-size:0.9412rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:14px;color:var(--fg3);flex:none}
.num{font-family:var(--font-round);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05}
.num small{font-family:var(--font);font-size:.55em;font-weight:500;color:var(--fg2);letter-spacing:0}
:root[lang="ar"] .num small{font-family:var(--font-ar)}
.fact .num{font-size:1.4118rem}
.fact .l{font-size:0.7353rem;color:var(--fg2);margin-top:2px}

/* Lists (grouped inset, glass) */
.group{display:flex;flex-direction:column;gap:8px}
.group-h{font-size:0.7647rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin:0 18px}
.group-f{font-size:0.7647rem;color:var(--fg2);margin:0 18px;line-height:1.45}
:root[lang="ar"] .group-h{text-transform:none;letter-spacing:0;font-size:0.8235rem}
.list{border-radius:var(--r-l);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:1px;background:var(--sep)}
.row.ic+.row.ic::before{inset-inline-start:58px}
.row .lbl{flex:1;min-width:0}
.icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.15)}

.stepper{display:flex;align-items:center;gap:12px}
.stepper .val{min-width:64px;text-align:end;color:var(--fg2);font-variant-numeric:tabular-nums;font-size:0.9412rem}
.step{display:flex;align-items:center;background:var(--fill);border-radius:99px;padding:2px}
.step button{width:40px;height:30px;display:grid;place-items:center;border-radius:99px;transition:background .2s}
.step button:active{background:var(--fill2)}
.step button svg{width:14px;height:14px}
.step span{width:1px;height:16px;background:var(--fg3)}

.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:var(--fill2);position:relative;cursor:pointer;transition:background .3s var(--ease);flex:none;margin:0}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.16),0 1px 1px rgba(0,0,0,.1);transition:transform .35s var(--ease),width .2s}
.switch:active::after{width:34px}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.switch:checked:active::after{transform:translateX(14px)}

.select{position:relative;display:inline-flex;align-items:center}
.select select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--fg2);font-size:0.9412rem;padding-block:4px;padding-inline:4px 20px;cursor:pointer;text-align:end}
.select select option{color:#000;background:#fff}
.select::after{content:"";position:absolute;inset-inline-end:3px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.8px solid var(--fg3);border-bottom:1.8px solid var(--fg3);transform:rotate(45deg);pointer-events:none}
input[type=range]{flex:1;min-width:0;accent-color:var(--blue);height:28px}
.seg.small button{font-size:0.7941rem;padding:7px 10px}
.row .seg{flex:none;min-width:180px;background:var(--fill)}

/* Stats */
.hero{border-radius:var(--r-xl);padding:20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.big-ring{width:116px;height:116px;flex:none;position:relative}
.big-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.big-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr}
.big-ring .c .num{font-size:1.6471rem}
.big-ring .c span{font-size:0.7059rem;color:var(--fg2)}
.hero .facts{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
.hero .num{font-size:1.7647rem}
.hero .l{font-size:0.7647rem;color:var(--fg2)}
.goal-chip{align-self:flex-start;font-size:0.7353rem;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border-radius:var(--r-l);padding:15px 16px}
.tile .l{font-size:0.7647rem;color:var(--fg2);font-weight:500}
.tile .num{font-size:1.6471rem;margin-top:6px}
.chart{border-radius:var(--r-xl);padding:18px 18px 14px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:156px;align-items:end;position:relative}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bar .b{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;min-height:4px;background:color-mix(in srgb,var(--red) 28%,transparent);transition:height .6s var(--ease)}
.bar.t .b{background:linear-gradient(180deg,color-mix(in srgb,var(--red) 75%,#fff),var(--red));box-shadow:0 6px 16px -6px var(--red)}
.bar .v{font-size:0.6471rem;color:var(--fg2);font-variant-numeric:tabular-nums;direction:ltr}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fg3);pointer-events:none}
.goal-line span{position:absolute;inset-inline-end:0;top:-19px;font-size:0.6471rem;color:var(--fg2)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:8px}
.days span{text-align:center;font-size:0.7059rem;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days span.t{color:var(--fg);font-weight:650}
.hist .when{font-size:0.7647rem;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;border-radius:3px;background:var(--red)}
.empty{color:var(--fg2);font-size:0.8824rem;padding:22px 16px;text-align:center}

/* Tasks */
.add{display:flex;gap:10px;align-items:center;border-radius:99px;padding:6px;padding-inline-start:20px}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:1rem;padding:9px 0}
.add input::placeholder{color:var(--fg3)}
.est{display:flex;align-items:center;gap:4px;font-size:0.7647rem;color:var(--fg2);flex:none}
.est button{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.est button svg{width:12px;height:12px}
.est b{min-width:20px;text-align:center;color:var(--fg);font-variant-numeric:tabular-nums;font-weight:650}
.addbtn{width:42px;height:42px;border-radius:50%;color:#fff;display:grid;place-items:center;flex:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 75%,#fff),var(--blue));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -4px color-mix(in srgb,var(--blue) 60%,transparent);transition:transform .2s var(--ease)}
.addbtn:active{transform:scale(.9)}
.addbtn svg{width:18px;height:18px}
.check{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--fg3);flex:none;display:grid;place-items:center;transition:all .25s var(--ease)}

.task.done .check{background:var(--blue);border-color:var(--blue)}
.task.done .check svg{opacity:1;transform:none}
.task.done .tname{color:var(--fg2);text-decoration:line-through}
.task .tbody{flex:1;min-width:0;text-align:start;display:flex;flex-direction:column;gap:5px;padding:3px 0}
.task.cur{background:color-mix(in srgb,var(--red) 8%,transparent)}
.tname{word-break:break-word;font-weight:500}
.tomatoes{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tomatoes i{width:9px;height:9px;border-radius:50%;background:var(--fill2)}

.tomatoes em{font-style:normal;font-size:0.7059rem;color:var(--fg2);margin-inline-start:4px;font-variant-numeric:tabular-nums}
.badge{font-size:0.7059rem;font-weight:650;color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent);padding:4px 9px;border-radius:99px;flex:none}
.del{color:var(--fg3);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;transition:all .2s}

.del svg{width:15px;height:15px}

/* Banner + alert */
.banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);width:min(440px,calc(100% - 32px));border-radius:26px;padding:12px 16px 12px 12px;display:flex;gap:12px;align-items:center;z-index:30;transition:transform .55s var(--ease);cursor:pointer}

.alert .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.alert .acts button.destructive{background:var(--red);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}

.mark{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--phase) 78%,#fff),var(--phase));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px -2px var(--drop);transition:background .6s}
.mark svg{width:20px;height:20px}
.mark.big{width:40px;height:40px;border-radius:10px}
.mark.big svg{width:26px;height:26px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--ease)}
.icon-btn:active{transform:scale(.88)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .moon{display:none}
:root.is-dark .icon-btn .sun{display:none}
:root.is-dark .icon-btn .moon{display:block}

/* Shared app bar + page layouts */
.appbar{flex:none;position:relative;z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 2px}
.appbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.view{padding-top:10px}
.page{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-direction:column;padding-bottom:2px}
.stats-grid,.settings-grid,.tasks-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.scol,.tasks-main{display:flex;flex-direction:column;gap:26px;min-width:0}
.tasks-side{min-width:0}
.sum-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.summary .tbar{margin-top:16px}
.sum-note{font-size:0.7353rem;color:var(--fg2);margin-top:8px}
.about .about-name{font-weight:650}
.about .about-sub{font-size:0.7647rem;color:var(--fg2)}
.about-ver{font-size:0.8235rem;color:var(--fg2);font-variant-numeric:tabular-nums}
@media (min-width:980px){
  .page{max-width:1040px}
  .large-title{font-size:2.2353rem}
  .stats-grid{grid-template-columns:repeat(12,minmax(0,1fr));column-gap:18px;row-gap:18px}
  .stats-grid .hero{grid-column:span 5;align-self:stretch;flex-direction:column;justify-content:center;text-align:center;gap:18px}
  .stats-grid .hero .facts{align-items:center;flex:none}
  .stats-grid .hero .goal-chip{align-self:center}
  .stats-grid .hero .big-ring{width:136px;height:136px}
  .stats-grid .chart{grid-column:span 7;align-self:stretch;display:flex;flex-direction:column}
  .stats-grid .chart .bars{flex:1;min-height:156px}
  .stats-grid .tiles{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr))}
  #topGroup{grid-column:span 5}
  #recentGroup{grid-column:span 7}
  #recentGroup.wide{grid-column:1/-1}
  .settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
  .tasks-grid{grid-template-columns:minmax(0,1fr) 340px;column-gap:28px}
  .tasks-side{order:0;position:sticky;top:0}
}

/* Paused-phase marker on the phase switcher */
.seg.phase button.parked::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-inline-start:6px;vertical-align:2px;background:var(--dot)}
.seg.phase button[data-v="focus"]{--dot:var(--red)} .seg.phase button[data-v="short"]{--dot:var(--green)} .seg.phase button[data-v="long"]{--dot:var(--indigo)}

/* Running phase marker (when looking at another phase) */
.seg.phase button.live::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-inline-start:6px;vertical-align:2px;background:var(--dot);animation:pulse-dot 1.6s ease-in-out infinite}
@keyframes pulse-dot{50%{opacity:.3}}
#btnSkip.off{opacity:.35;pointer-events:none}
.alert .acts button.go{background:var(--phase);color:#fff}

/* Mini control above the tab bar */
.mini-ctl{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;align-items:center;gap:6px;padding:5px;padding-inline-start:6px;border-radius:99px;
  opacity:0;transform:translate(-50%,10px) scale(.96);pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease)}
.mini-ctl.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.mini-ctl[data-p="focus"]{--mc:var(--red)} .mini-ctl[data-p="short"]{--mc:var(--green)} .mini-ctl[data-p="long"]{--mc:var(--indigo)}
.mc-open{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:99px;font-size:0.8235rem;font-weight:600;white-space:nowrap}
.mc-dot{width:8px;height:8px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 22%,transparent)}
.mini-ctl.run .mc-dot{animation:pulse-dot 1.6s ease-in-out infinite}
.mc-name{color:var(--fg2);font-weight:550}
.mc-time{font-family:var(--font-round);font-variant-numeric:tabular-nums;font-size:0.9412rem;font-weight:650;color:var(--mc);direction:ltr;min-width:48px}
.mc-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;transition:transform .2s var(--ease);
  background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 75%,#fff),var(--mc));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px -4px color-mix(in srgb,var(--mc) 70%,transparent)}
.mc-btn:active{transform:scale(.9)}
.mc-btn svg{width:16px;height:16px}
.mc-btn .i-pause{display:none}
.mini-ctl.run .mc-btn .i-pause{display:block}
.mini-ctl.run .mc-btn .i-play{display:none}
.has-mini .view{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
:root[lang="ar"] .mc-name{unicode-bidi:plaintext}

/* Presets */
.presets{padding:0 2px}
.presets .chip{background:var(--glass-strong);box-shadow:inset 0 0 0 .5px var(--rim),0 2px 8px -4px var(--drop)}
.presets .chip.on{background:color-mix(in srgb,var(--phase) 15%,var(--glass-strong));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--phase) 38%,transparent)}
.chip small{font-size:0.7059rem;font-weight:500;color:var(--fg2);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.chip.on small{color:inherit;opacity:.75}
.chip.add{color:var(--blue)} .chip.add svg{color:var(--blue);width:12px;height:12px}
.preset-form{margin-top:0;background:var(--glass-strong)}

/* Session notes */
.alert.note{width:min(380px,100%);text-align:start}
.alert.note b,.alert.note p{text-align:center}
.alert.note textarea{display:block;width:100%;border:0;outline:none;resize:none;border-radius:14px;background:var(--fill);padding:12px 14px;font:inherit;font-size:0.9412rem;line-height:1.4;color:var(--fg);margin:0 0 16px}
.alert.note textarea::placeholder{color:var(--fg3)}
.hist .row{cursor:pointer}
.hist .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.hist .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snote{font-size:0.7941rem;color:var(--fg2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.zen{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(24px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(24px,env(safe-area-inset-left,0px));animation:zen-in .5s var(--ease)}
@keyframes zen-in{from{opacity:0}}
.zen-glow{position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--phase) 20%,transparent) 0%,transparent 48%);transition:background 1s}
.zen-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
.zen .phase-pill{font-size:0.8824rem}
.zen-clock{font-family:var(--font-round);font-weight:200;font-size:clamp(88px,25vw,232px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.zen-bar{width:min(440px,72vw);height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:26px}
.zen-bar i{display:block;height:100%;width:0;border-radius:2px;background:var(--phase);transition:width .3s linear,background .6s}
.zen-task{margin-top:16px;color:var(--fg2);font-size:0.9412rem;font-weight:500;max-width:min(520px,80vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zen-ctl{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:20px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease)}
.zen-hint{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:24px;right:24px;text-align:center;font-size:0.7647rem;color:var(--fg3);opacity:0;transition:opacity .35s}
.zen.ui .zen-ctl{opacity:1;transform:none;pointer-events:auto}
.zen.ui .zen-hint{opacity:1}
.zen.ui{cursor:default} .zen:not(.ui){cursor:none}
:root[lang="ar"] :where(.snote,.hist .ttl,#zTask,#zPhase,#nTitle,#nSub,.zen-hint,.chip small){unicode-bidi:plaintext}
:root[lang="ar"] :where(.snote,.hist .ttl){text-align:left}

/* Music */
.icon-btn.on{color:var(--phase)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--fill);font-size:0.8235rem;font-weight:550;color:var(--fg);max-width:100%;transition:background .3s var(--ease),color .3s,box-shadow .3s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip svg{width:16px;height:16px;flex:none;color:var(--fg2);transition:color .3s}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.on{background:color-mix(in srgb,var(--phase) 15%,transparent);color:var(--phase);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--phase) 38%,transparent)}
.chip.on svg{color:var(--phase)}
.chip.wait{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--phase) 38%,transparent)}
.chip .svc{width:8px;height:8px;border-radius:50%;background:var(--s);flex:none}
.chip .x{width:18px;height:18px;margin-inline:2px -5px;border-radius:50%;display:grid;place-items:center;color:var(--fg3);flex:none}
.chip .x svg{width:10px;height:10px;color:inherit}
.m-add{display:flex;gap:8px;align-items:center;margin-top:12px;background:var(--fill);border-radius:99px;padding:4px;padding-inline-start:14px}
.m-add input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:0.8824rem;padding:8px 0}
.m-add input::placeholder{color:var(--fg3)}
.m-add .addbtn{width:34px;height:34px}
.m-add .addbtn svg{width:15px;height:15px}
.m-err{font-size:0.7647rem;color:var(--red);margin-top:8px;line-height:1.4}
.player{margin-top:12px;border-radius:var(--r-m);overflow:hidden;background:var(--fill)}
.player-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;font-size:0.7941rem;font-weight:600}
.player-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame iframe{display:block;width:100%;border:0}
#wakeVid{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

/* Arabic: same layout as English (no mirroring). Text runs right-to-left inside each element. */
:root[lang="ar"] :where([data-i18n],#phaseLabel,#nextLabel,#dotsLabel,#cycleTotal,#chipTask,#todayGoalTxt,#musicNow,#playerName,.fact .l,.tname,.badge,.empty,#sumNote,#statsDate,#goalNote,#goalChip,#weekTotal,.days span,.goal-line span,.hist .lbl,.hist .when,#topTasks .lbl span,#bTitle,#bText,#cTitle,#cText,#cYes,.stepper .val,.chip span,.m-err,#alertNote,select){unicode-bidi:plaintext}
:root[lang="ar"] :where(.large-title,.subhead,.group-h,.group-f,.lbl,.task-card .k,.task-card .v,.fact .l,.sum-note,.about-name,.about-sub,#goalNote,.banner b,.banner span,.tname,.tile .l,.m-sub,.m-foot,.m-err,.card-h b){text-align:left}
:root[lang="ar"] :where(.stepper .val,.select select){text-align:right}
:root .tname{unicode-bidi:plaintext}
@media (min-width:980px){:root[lang="ar"] .stats-grid .hero :where(.l,#goalNote){text-align:center}}

/* =====================================================================
   MOBILE-FIRST LAYER — iPhone first,then iPad / Android tablets.
   Phone: one calm screen per tab,floating tab bar at the bottom.
   Tablet (≥744px): tab bar moves to the top (iPadOS style),roomier timer.
   Wide (≥1024px): timer gets a side column.
   ===================================================================== */
html{font-size:17px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (hover:none) and (pointer:coarse){@supports (font:-apple-system-body){html{font:-apple-system-body}}}
body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea,.tname,.snote,.player iframe{-webkit-user-select:text;user-select:text}
button,[role="button"],a,input,label,select{touch-action:manipulation}
input,textarea,select{font-size:max(16px,1rem)}

/* Timer: everything on one screen,dial takes the space that is left */
#v-timer{display:flex;flex-direction:column}
#v-timer[hidden]{display:none}
.timer-main{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4dvh,24px);width:100%;min-height:0}
#phaseSeg{width:100%;flex:none}
#phaseSeg button{font-size:min(.8235rem,17px)}
.dial-wrap{flex:1 1 0;min-height:210px;width:100%;align-self:stretch;container-type:size;display:grid;place-items:center}
.dial{width:min(100cqw,100cqh,400px);min-width:200px}
.dial-center{gap:4px}
.phase-pill{font-size:min(.7647rem,15px)}
.clock{font-size:clamp(52px,17cqmin,92px)}
.dial-center .next{font-size:min(.8rem,15px)}
.cycle-dots{display:flex;gap:7px;margin-top:8px;min-height:8px}
.cycle-dots i{width:7px;height:7px;border-radius:50%;background:var(--fill2);transition:background .4s}
.cycle-dots i.f{background:var(--red)}
.cycle-dots i.c{background:transparent;box-shadow:inset 0 0 0 1.6px var(--red)}
.running .cycle-dots i.c{animation:pulse-dot 1.6s ease-in-out infinite}
.controls{flex:none;gap:22px}
.ctl-label{font-size:min(.7rem,13px)}
.task-card{flex:none;width:100%;max-width:440px;padding:10px 14px;border-radius:var(--r-l);min-height:56px}
.task-card .icon{width:28px;height:28px}
.task-card .k{font-size:min(.72rem,14px)}
.task-card .v{font-size:min(.94rem,19px)}

/* Phone: the brand bar only on the Timer tab; other tabs open with their large title */
.appbar{padding-block:8px 0}
.appbar-in{min-height:44px}
.datechip,#themeToggle{display:none}
body:not([data-view="timer"]) .appbar{display:none}
body:not([data-view="timer"]) .view{padding-top:14px}
.large-title{margin-top:10px}
.mini-ctl{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.has-mini .view{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* Touch targets: at least 44 × 44 pt */
.icon-btn{width:44px;height:44px}
.icon-btn svg{width:20px;height:20px}
.step button{width:46px;height:36px}
.est button{width:36px;height:36px}
.del{width:44px;height:44px;margin-inline-end:-8px}
.check{position:relative}
.check::after{content:"";position:absolute;inset:-9px}
.textbtn{min-height:44px;display:inline-flex;align-items:center}
.seg button{min-height:38px}
.chip{min-height:40px}
.round{width:60px;height:60px}
.primary{height:60px;min-width:156px}
.addbtn{width:44px;height:44px}
.row{min-height:52px}
.switch{flex:none}

/* Sounds tab */
.sounds-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:start}
.amb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.amb-tile{border-radius:var(--r-l);padding:16px;min-height:100px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;text-align:start;font-size:1rem;font-weight:600;transition:transform .25s var(--ease),background .3s,color .3s,box-shadow .3s}
.amb-tile:active{transform:scale(.96)}
.amb-tile svg{width:30px;height:30px;color:var(--fg2);transition:color .3s}
.amb-tile.on{color:var(--phase);background:color-mix(in srgb,var(--phase) 14%,var(--glass-strong));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--phase) 45%,transparent),0 10px 30px -12px color-mix(in srgb,var(--phase) 60%,transparent)}
.amb-tile.on svg{color:var(--phase)}
.amb-tile.wait{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--phase) 40%,transparent)}
.amb-grid + .list{margin-top:4px}
.row.st{cursor:pointer;gap:14px}
.row.st .svc{width:10px;height:10px;border-radius:50%;background:var(--s);flex:none;margin-inline:4px 2px}
.row.st .lbl{display:flex;flex-direction:column;min-width:0}
.row.st .st-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row.st small{font-size:.76rem;color:var(--fg2)}
.row.st.on .st-name{color:var(--phase);font-weight:600}
.st-play{width:16px;height:16px;color:var(--fg3);flex:none}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px;flex:none}
.eq i{width:3px;border-radius:2px;background:var(--phase);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s} .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.row.st + .row.st::before{inset-inline-start:42px}
.player.glass{margin:0;border-radius:var(--r-l);background:var(--glass)}
.player-h{padding:8px 4px 8px 16px;font-size:.88rem}
.player .frame{padding:0 10px 10px}
.player .frame iframe{border-radius:12px}
#linkForm{margin-top:4px}
#linkForm input{font-size:max(16px,.94rem)}

/* Small details */
.add{padding:6px;padding-inline-start:18px}
.banner{width:min(480px,calc(100% - 24px))}
.zen-ctl .round{width:64px;height:64px}

/* Short phones (iPhone SE, mini): tighter spacing */
@media (max-height:600px) and (orientation:portrait){.timer-main{gap:10px}.ctl-label{display:none}.task-card{min-height:50px;padding-block:7px}}

/* Phone in landscape: dial on the left, controls on the right */
@media (orientation:landscape) and (max-height:520px){
  .appbar{display:none}
  .view{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  
  .timer-main{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"dial seg" "dial controls" "dial task";column-gap:28px;row-gap:12px;align-items:center}
  .dial-wrap{grid-area:dial;width:min(46vw,calc(100dvh - 110px));height:min(46vw,calc(100dvh - 110px));flex:none;min-height:0}
  #phaseSeg{grid-area:seg} .controls{grid-area:controls} .task-card{grid-area:task;max-width:none}

  .mini-ctl{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
}

/* ---------- Tablet: iPad portrait,Android tablets (≥744px) ---------- */
@media (min-width:744px) and (min-height:521px){
  .appbar{display:block!important;padding-block:12px 4px}
  .appbar-in{max-width:1180px;min-height:52px}
  .datechip,#themeToggle{display:block}
  #themeToggle{display:grid}
  /* tab bar floats at the top, centred, iPadOS style */

  .brand > span:last-child{display:none}
  .view{padding-top:18px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body:not([data-view="timer"]) .view{padding-top:18px}
  .has-mini .view{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  .mini-ctl{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .page{max-width:720px}
  
  .dial{width:min(100cqw,100cqh,480px)}
  .clock{font-size:clamp(64px,17cqmin,112px)}
  .controls{gap:28px}
  .round{width:66px;height:66px} .primary{height:66px;min-width:184px;font-size:1.12rem}
  .amb-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .banner{top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 140px))}
  .banner.show{transform:translate(-50%,0)}
  .timer-main{justify-content:center}
  .dial-wrap{flex:0 1 560px}
}
@media (min-width:744px) and (max-width:1023px){ .datechip{display:none} }
@media (min-width:1024px) and (min-height:521px){ .brand > span:last-child{display:inline} }

/* ---------- Wide: iPad landscape and larger (≥1024px) ---------- */
@media (min-width:1024px) and (min-height:521px){
  
  .timer-main{align-self:stretch;justify-content:normal}
  .timer-main .dial-wrap{flex:1 1 0}
  
  .page{max-width:1080px}
  .sounds-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:32px}
  .amb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- Accessibility preferences ---------- */
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--glass-strong);-webkit-backdrop-filter:none;backdrop-filter:none}
  .glass::before{display:none}
}
@media (prefers-contrast:more){
  :root{--fg2:rgba(20,20,30,.82);--fg3:rgba(20,20,30,.6);--sep:rgba(20,20,45,.22)}
  :root.is-dark{--fg2:rgba(245,245,250,.85);--fg3:rgba(245,245,250,.62);--sep:rgba(255,255,255,.24)}
  .glass{box-shadow:inset 0 0 0 1.5px var(--sep),0 2px 6px -2px var(--drop)}
  .seg button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:3px}
}
@media (forced-colors:active){.lens{outline:2px solid CanvasText}.primary,.mc-btn{border:2px solid ButtonText}}

/* =====================================================================
   WIDGET HOME — the Timer tab becomes a home screen of widgets.
   Rules: (1) timer + at most 4 small tiles, (2) the timer stays largest,
   (3) with large text the tiles become full-width rows, (4) while a focus
   session runs the tiles fade back so the timer leads.
   Other screens open from the tiles (or the gear) and have a Home button.
   ===================================================================== */
body:not([data-view="timer"]) .appbar{display:none!important}
.view{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.has-mini .view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.mini-ctl{bottom:calc(18px + env(safe-area-inset-bottom,0px))!important}
#themeToggle{display:none!important}

.home{width:100%;max-width:560px;margin:0 auto;display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,max(9.4rem,150px)),1fr))}
.w{border-radius:26px;min-width:0}
.w-timer{grid-column:1/-1;padding:14px 14px 16px}
.w-timer .timer-main{gap:14px}
.w-timer .dial-wrap{flex:none;height:clamp(210px,calc(100dvh - 420px),330px);min-height:0}
.w-timer .dial{width:min(100cqw,100cqh,330px)}
.w-timer .task-card{background:var(--fill);box-shadow:none;max-width:none;border-radius:18px}
.w-timer .task-card::before{display:none}

.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 15px;min-height:126px;text-align:start;position:relative;
  transition:opacity .5s var(--ease),transform .25s var(--ease),filter .5s}
.tile:active{transform:scale(.97)}
.w-h{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:min(.7rem,13px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin-bottom:4px}
:root[lang="ar"] .w-h{letter-spacing:0;text-transform:none;font-size:min(.78rem,14px)}
.w-go{width:7px;height:12px;color:var(--fg3);flex:none}
.w-n{font-family:var(--font-round);font-size:1.7rem;font-weight:650;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.w-n-sm{font-family:var(--font);font-size:1.02rem;font-weight:650;letter-spacing:-.01em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-s{font-size:.8rem;color:var(--fg2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-ring{position:absolute;right:14px;bottom:14px;width:42px;height:42px}
.w-ring circle:last-child{transition:stroke-dashoffset .8s var(--ease)}
.w-icon{width:28px;height:28px;color:var(--phase);margin:2px 0 4px}
.w-icon svg{width:100%;height:100%}
.w-icon.off{color:var(--fg3)}
.w-bars{display:flex;align-items:flex-end;gap:4px;height:26px;margin-top:auto;padding-top:8px;width:100%}
.w-bars i{flex:1;border-radius:3px;min-height:3px;background:color-mix(in srgb,var(--red) 30%,transparent)}
.w-bars i.t{background:var(--red)}
#wTodayN,#wStreakN{padding-inline-end:50px}
:root[lang="ar"] :where(.w-s,.w-n-sm){unicode-bidi:plaintext}

/* Rule 4: while focusing,the tiles step back */
body.focus-run .tile{opacity:.4;filter:saturate(.5)}
body.focus-run .tile:hover,body.focus-run .tile:focus-visible{opacity:1;filter:none}

/* Pages: Home button + gentle push animation */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 4px;margin:0 0 -2px -4px;color:var(--blue);font-size:1rem;font-weight:500;align-self:flex-start}
.back svg{width:10px;height:18px}
.view:not(#v-timer):not([hidden]){animation:push .38s var(--ease)}
#v-timer:not([hidden]){animation:fadein .3s ease}
@keyframes push{from{opacity:0;transform:translateX(24px)}}
@keyframes fadein{from{opacity:0}}
.large-title{margin-top:2px}

/* Phone landscape: timer widget side by side */
@media (orientation:landscape) and (max-height:520px){
  .appbar{display:none!important}
  .home{max-width:880px}
  .w-timer .dial-wrap{height:auto;width:min(46vw,calc(100dvh - 90px));aspect-ratio:1}
}

/* Tablet portrait: timer across the top,four tiles in a row */
@media (min-width:744px) and (min-height:521px){
  .home{max-width:760px;grid-template-columns:repeat(auto-fill,minmax(min(100%,max(9.4rem,150px)),1fr));gap:16px}
  .w-timer{padding:22px}
  .w-timer .dial-wrap{height:clamp(260px,calc(100dvh - 520px),440px)}
  .w-timer .dial{width:min(100cqw,100cqh,440px)}
  .w-timer .timer-main{gap:18px}
  .w-timer .task-card{max-width:460px}
  .tile{min-height:150px;padding:18px}
  .datechip{display:block!important}
}
/* Tablet landscape and up: timer on the left,2×2 tiles on the right */
@media (min-width:1024px) and (min-height:521px){
  .home{max-width:1120px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr 1fr;min-height:calc(100dvh - 120px)}
  .w-timer{grid-column:1/3;grid-row:1/3;display:flex;flex-direction:column;justify-content:center}
  .w-timer .dial-wrap{height:clamp(260px,calc(100dvh - 400px),460px)}
  .w-timer .dial{width:min(100cqw,100cqh,460px)}
  .tile{min-height:0;padding:22px}
  .w-n{font-size:2.2rem}
  .w-ring{width:56px;height:56px;right:20px;bottom:20px}
}

/* =====================================================================
   POLISH — motion, press feedback, single-line labels, fuller iPad tiles
   ===================================================================== */
/* Phase colour fades instead of jumping (Safari 16.4+, Chrome 85+) */
@property --phase{syntax:'<color>';inherits:true;initial-value:#FF3B30}
:root{transition:--phase .7s ease}
.prog,.knob{transition:stroke-dashoffset .3s linear,stroke .7s ease}

/* "Next · Break · 5 min" always on one line inside the dial */
.dial-center .next{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}

/* One press feedback everywhere */
:where(.tile,.task-card,.row[role="button"],.row.st,.amb-tile,.chip,.back,.icon-btn,.round,.addbtn,.mc-btn){transition:transform .22s var(--ease),opacity .5s var(--ease),filter .5s,background .3s,box-shadow .3s,color .3s}
:where(.tile,.task-card,.amb-tile,.chip,.icon-btn,.round,.addbtn,.mc-btn):active{transform:scale(.96)}
:where(.row[role="button"],.row.st,.hist .row):active{background:var(--fill)}
.back:active{opacity:.55}
@media (hover:hover){:where(.tile,.task-card,.amb-tile):hover{box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--rim),0 16px 44px -12px var(--drop),0 2px 6px -2px var(--drop)}}

/* Calmer fade while focusing; a little deeper in dark mode */
body.focus-run .tile{opacity:.42}
.is-dark body.focus-run .tile, :root.is-dark body.focus-run .tile{opacity:.5}

/* Tasks tile list (shown only where tiles are tall) */
.w-list{display:none;flex-direction:column;gap:6px;margin-top:auto;width:100%;padding-top:10px}
.w-list i{font-style:normal;font-size:.82rem;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline-start:12px;position:relative}
.w-list i::before{content:"";position:absolute;inset-inline-start:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;border:1.4px solid var(--fg3)}
:root[lang="ar"] .w-list i{unicode-bidi:plaintext}

@media (min-width:1024px) and (min-height:521px){
  .tile{justify-content:flex-start;gap:4px}
  .w-n{font-size:2.6rem;margin-top:6px}
  .w-n-sm{font-size:1.35rem;margin-top:2px}
  .w-s{font-size:.9rem}

const M = S.music;

const bufCache = {};

    for (let i = 0; i < g.length; i++){

      else if (kind === 'pink') { b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; g[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }

    }
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = g[i];
    for (let i = 0; i < fade; i++){ const a = i / fade; d[i] = g[len + i]*(1 - a) + g[i]*a; } // seamless loop
  }

    m = path.match(/^\/(?:intl-[a-z-]+\/)?(?:embed\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/i);
    if (!m) return null;
    return {svc:'spotify', key:'spotify:' + m[1] + ':' + m[2], src:'https://open.spotify.com/embed/' + m[1] + '/' + m[2], h:152, canon:'https://open.spotify.com/' + m[1] + '/' + m[2]};
  }
  if (host === 'soundcloud.com' || host === 'm.soundcloud.com' || host === 'on.soundcloud.com') {
    if (path.split('/').filter(Boolean).length < 1) return null;
    const clean = 'https://' + (host === 'm.soundcloud.com' ? 'soundcloud.com' : host) + path;
    return {svc:'soundcloud', key:'sc:' + clean, src:'https://w.soundcloud.com/player/?url=' + encodeURIComponent(clean) + '&auto_play=true&visual=false&show_comments=false&hide_related=true', h:166, canon:clean};
  }
  if (host === 'music.apple.com' || host === 'embed.music.apple.com') {
    if (!/\/(album|playlist|station|song|music-video)\//.test(path)) return null;
    const single = u.searchParams.has('i') || /\/(song|station)\//.test(path);
    return {svc:'apple', key:'am:' + path + (u.searchParams.get('i') || ''), src:'https://embed.music.apple.com' + path + u.search, h: single ? 175 : 450, canon:'https://music.apple.com' + path + u.search};
  }
  return null;
}
function stationName(x){ return x.k ? t(x.k) : (x.name || SVC[(parseLink(x.url) || {}).svc || 'youtube'].n); }
let playing = null; // station id currently in the player
const XS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
function renderStations(){
  const all = PRESETS.concat(M.links);

      (own ? '<button class="del" type="button" data-del="' + esc(x.id) + '" aria-label="' + t('removeStation') + '">' + XS + '</button>' : '') + '</div>';

}

$('#stChips').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-st]')) { e.preventDefault(); e.target.click(); } });
$('#stChips').addEventListener('click', e => {

async function fetchTitle(url){
  try {
    const c = new AbortController(); const to = setTimeout(() => c.abort(), 5000);
    const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(url), {signal: c.signal}); clearTimeout(to);
    const j = await r.json(); return j && typeof j.title === 'string' ? j.title.slice(0, 60) : null;
  } catch(e){ return null; }
}
$('#linkForm').addEventListener('submit', async e => {
  e.preventDefault();

  if (dup) { $('#linkIn').value = ''; openStation(dup); return; }
  const x = {id: 'u' + Date.now().toString(36), url: p.canon || raw.trim(), name: null};

$('#linkIn').addEventListener('input', () => { $('#linkErr').hidden = true; });
function renderMusic(){

/* ---------- Timer presets ---------- */
const PRESETS_T = [
  {id:'classic', k:'pr_classic', focus:25, short:5,  long:15, interval:4},
  {id:'deep',    k:'pr_deep',    focus:50, short:10, long:30, interval:3},
  {id:'study',   k:'pr_study',   focus:45, short:15, long:30, interval:3},
  {id:'quick',   k:'pr_quick',   focus:15, short:3,  long:10, interval:4},
];
const PKEYS = ['focus','short','long','interval'];
const presetMatches = p => PKEYS.every(k => S.settings[k] === p[k]);
function applyPreset(p){
  PKEYS.forEach(k => {
    const old = S.settings[k], v = p[k]; S.settings[k] = v;
    if (k === 'interval') return;
    if (k === T.phase && !T.running && (T.remaining >= old*60000 || T.remaining > v*60000)) T.remaining = v*60000;
    if (T.parked[k] && T.parked[k] >= v*60000) delete T.parked[k];
  });
  steppers.forEach(f => f()); save(); render(); renderPresets();
}
function renderPresets(){
  const all = PRESETS_T.concat(S.presets);
  $('#presetChips').innerHTML = all.map(p => {
    const own = !p.k;
    return '<button class="chip' + (presetMatches(p) ? ' on' : '') + '" data-pr="' + esc(p.id) + '"><span>' + esc(own ? p.name : t(p.k)) + '</span><small>' + p.focus + '/' + p.short + '/' + p.long + ' ×' + p.interval + '</small>' +
      (own ? '<span class="x" data-prdel="' + esc(p.id) + '" role="button" aria-label="' + t('removePreset') + '">' + XS + '</span>' : '') + '</button>';
  }).join('') + (all.some(presetMatches) ? '' : '<button class="chip add" id="presetSave"><svg viewBox="0 0 14 14"><use href="#i-plus"/></svg><span>' + t('savePreset') + '</span></button>');
}
$('#presetChips').addEventListener('click', e => {
  const del = e.target.closest('[data-prdel]');
  if (del) { e.stopPropagation(); S.presets = S.presets.filter(x => x.id !== del.dataset.prdel); save(); renderPresets(); return; }
  if (e.target.closest('#presetSave')) { const f = $('#presetForm'); f.hidden = !f.hidden; if (!f.hidden) $('#presetName').focus(); return; }
  const b = e.target.closest('[data-pr]'); if (!b) return;
  const p = PRESETS_T.concat(S.presets).find(x => x.id === b.dataset.pr); if (p) applyPreset(p);
});
$('#presetForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#presetName').value.trim(); if (!name) { $('#presetName').focus(); return; }
  const p = {id: 'c' + Date.now().toString(36), name}; PKEYS.forEach(k => p[k] = S.settings[k]);
  S.presets.push(p); if (S.presets.length > 12) S.presets.shift();
  $('#presetName').value = ''; $('#presetForm').hidden = true; save(); renderPresets();
});

/* ---------- Session notes ---------- */
let pendingNote = null, noteFor = null;
function openNote(ts, fresh){
  const s = S.sessions.find(x => x.t === ts); if (!s) return;
  noteFor = ts;
  $('#nTitle').textContent = fresh ? t('noteTitle') : t('editNoteTitle');
  $('#nSub').textContent = sessLabel(s) + ' · ' + count(s.min, 'min');
  $('#noteIn').value = s.note || '';
  $('#nSkip').textContent = fresh ? t('noteSkip') : t('cancel');
  $('#noteSheet').hidden = false;
  setTimeout(() => $('#noteIn').focus(), 60);
}
function closeNote(saveIt){
  if (saveIt && noteFor != null) {
    const s = S.sessions.find(x => x.t === noteFor), v = $('#noteIn').value.trim();
    if (s) { if (v) s.note = v.slice(0, 280); else delete s.note; save(); renderStats(); }
  }

function maybeAskNote(){

}
$('#noteForm').addEventListener('submit', e => { e.preventDefault(); closeNote(true); });
$('#nSkip').addEventListener('click', () => closeNote(false));
$('#noteSheet').addEventListener('click', e => { if (e.target.id === 'noteSheet') closeNote(false); });
$('#noteIn').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); closeNote(true); } });
const histOpen = e => { const r = e.target.closest('[data-t]'); if (r) openNote(+r.dataset.t, false); };
$('#hist').addEventListener('click', histOpen);
$('#hist').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); histOpen(e); } });

/* ---------- Full-screen focus mode ---------- */
let zenOpen = false, zenTimer = null, zenFS = false;
const zen = $('#zen');
function zenUI(){
  zen.classList.add('ui'); clearTimeout(zenTimer);

}

  const full = rem >= total;
  $('#zToggle').textContent = T.running ? t('pause') : (full ? (T.phase === 'focus' ? t('start') : t('startBreak')) : t('resume'));
  $('#zToggle').classList.toggle('paused', T.running);

}

/* ---------- Widget home ---------- */
function streakDays(){
  const set = new Set(S.sessions.map(x => dayKey(x.t))); let n = 0; const d = new Date();
  if (!set.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const NOTE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5.8l11-2.3v12"/><circle cx="6.3" cy="18" r="2.8" fill="currentColor" stroke="none"/><circle cx="17.3" cy="15.5" r="2.8" fill="currentColor" stroke="none"/></svg>';
function renderWidgets(){
  if (!$('#wToday')) return;
  const now = new Date(), k = dayKey(now); let n = 0, mm = 0;
  S.sessions.forEach(x => { if (dayKey(x.t) === k) { n++; mm += x.min; } });
  const g = S.settings.goal;
  $('#wTodayN').textContent = n + '/' + g;
  $('#wTodayS').textContent = hm(mm);
  $('#wTodayRing').style.strokeDashoffset = 251.3 * (1 - Math.min(1, n / g));
  // tasks
  const open = S.tasks.filter(x => !x.complete), ct = S.tasks.find(x => x.id === S.currentTask && !x.complete);
  $('#wTasksN').textContent = open.length;
  $('#wTasksS').textContent = ct ? taskName(ct) : (open.length ? t('chooseTask') : t('noTasksShort'));
  $('#wTasksL').innerHTML = open.filter(x => x !== ct).slice(0, 3).map(x => '<i>' + esc(taskName(x)) + '</i>').join('');
  // sound
  const ico = $('#wSoundI');
  if (M.amb && (ambOn || M.withTimer)) {
    const src = $('#ambChips [data-amb="' + M.amb + '"] svg'); ico.innerHTML = src ? src.outerHTML : NOTE_ICON;
    $('#wSoundN').textContent = t('a_' + M.amb); $('#wSoundS').textContent = ambOn ? t('playingW') : t('waiting');
  } else if (playing) {
    const x = PRESETS.concat(M.links).find(y => y.id === playing);
    ico.innerHTML = NOTE_ICON; $('#wSoundN').textContent = x ? stationName(x) : ''; $('#wSoundS').textContent = t('playingW');
  } else { ico.innerHTML = NOTE_ICON; $('#wSoundN').textContent = t('off'); $('#wSoundS').textContent = t('tapToChoose'); }
  ico.classList.toggle('off', !(ambOn || playing));
  // streak + this week
  const st = streakDays();
  $('#wStreakN').textContent = st;
  $('#wStreakS').textContent = st ? t('inARow', {d: count(st, 'day')}) : t('startStreak');
  const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); const kk = dayKey(d); days.push(S.sessions.reduce((a, x) => a + (dayKey(x.t) === kk ? x.min : 0), 0)); }
  const mx = Math.max(1, ...days);
  $('#wBars').innerHTML = days.map((v, i) => '<i class="' + (i === 6 ? 't' : '') + '" style="height:' + Math.max(8, v / mx * 100) + '%"></i>').join('');
  document.body.classList.toggle('focus-run', T.running && T.phase === 'focus' && VP === T.phase);
}
// Navigation: tiles, the gear and the Home buttons
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) showView(b.dataset.go); });
// Swipe from the left edge to go back home (pages only)
let edgeX = null, edgeY = 0;

document.addEventListener('touchend', e => { if (edgeX == null) return; const p = e.changedTouches[0]; if (p.clientX - edgeX > 80 && Math.abs(p.clientY - edgeY) < 60) showView('timer'); edgeX = null; }, {passive:true});
