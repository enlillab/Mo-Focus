<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mo Focus">
<meta name="description" content="Mo Focus, a Pomodoro focus timer: 25-minute focus sessions, 5-minute breaks, and a 15-minute break after every four.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}</style>
<title>Mo Focus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: calm neutral ground behind layered glass; colour lives only in the timer, controls and data. Floating glass tab bar; timer + side column on wide screens, single column on phones. */
:root{
  --bg:#F2F2F7; --fg:#0B0B10; --fg2:rgba(28,28,40,.62); --fg3:rgba(28,28,40,.34); --sep:rgba(20,20,45,.09);
  --fill:rgba(118,118,140,.13); --fill2:rgba(118,118,140,.22);
  --glass:rgba(255,255,255,.82); --glass-strong:rgba(255,255,255,.92); --glass-edge:rgba(255,255,255,.80);
  --hl:rgba(255,255,255,1); --rim:rgba(0,0,0,.04); --drop:rgba(30,30,60,.08); --sheen:rgba(255,255,255,.55);
  --red:#FF3B30; --green:#34C759; --indigo:#5856D6; --blue:#007AFF; --orange:#FF9500; --pink:#FF2D55; --gray:#8E8E93;
  --b1:#FF6A4D; --b2:#FFB340; --b3:#FF4F8B;
  --phase:var(--red);
  --on-accent:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-round:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-ar:-apple-system,BlinkMacSystemFont,"SF Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r-xl:30px; --r-l:22px; --r-m:16px;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.32); --sep:rgba(255,255,255,.09);
  --fill:rgba(130,130,150,.20); --fill2:rgba(130,130,150,.32);
  --glass:rgba(28,28,32,.92); --glass-strong:rgba(44,44,50,.95); --glass-edge:rgba(255,255,255,.14);
  --hl:rgba(255,255,255,.12); --rim:rgba(255,255,255,.06); --drop:rgba(0,0,0,.45); --sheen:rgba(255,255,255,.10);
  --red:#FF453A; --green:#30D158; --indigo:#5E5CE6; --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.32); --sep:rgba(255,255,255,.09);
  --fill:rgba(130,130,150,.20); --fill2:rgba(130,130,150,.32);
  --glass:rgba(28,28,32,.92); --glass-strong:rgba(44,44,50,.95); --glass-edge:rgba(255,255,255,.14);
  --hl:rgba(255,255,255,.12); --rim:rgba(255,255,255,.06); --drop:rgba(0,0,0,.45); --sheen:rgba(255,255,255,.10);
  --red:#FF453A; --green:#30D158; --indigo:#5E5CE6; --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F;
  color-scheme:dark;
}
:root[data-phase="short"]{--phase:var(--green); --b1:#2FD47A; --b2:#3CC8E0; --b3:#A6E35A}
:root[data-phase="long"]{--phase:var(--indigo); --b1:#6A5CFF; --b2:#3D9BFF; --b3:#C063F5}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.4 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;font-feature-settings:"cv11","ss01"}
:root[lang="ar"] body{font-family:var(--font-ar);letter-spacing:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid color-mix(in srgb,var(--blue) 70%,transparent);outline-offset:2px}


/* Glass material */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 0 var(--hl),inset 0 0 0 1px var(--rim),inset 0 -1px 1px 0 var(--rim),0 12px 40px -8px var(--drop),0 2px 6px -2px var(--drop);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(160deg,var(--sheen) 0%,transparent 34%,transparent 70%,color-mix(in srgb,var(--sheen) 40%,transparent) 100%)}
.glass.strong{background:var(--glass-strong)}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(118px + env(safe-area-inset-bottom,0px))}
.col{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* Headers */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:650;font-size:17px;letter-spacing:-.02em}
.brand svg{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:0 2px 8px -2px var(--drop)}
.datechip{font-size:13px;font-weight:500;color:var(--fg2);padding:7px 12px;border-radius:99px;white-space:nowrap}
.large-title{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.025em;margin:6px 4px 0;line-height:1.12;text-wrap:balance}
.subhead{color:var(--fg2);font-size:15px;margin:6px 4px 0;max-width:52ch;line-height:1.45}
:root[lang="ar"] .large-title,:root[lang="ar"] .brand{font-family:var(--font-ar);letter-spacing:0}
:root[lang="ar"] .large-title{font-size:32px;line-height:1.35}

/* Segmented control with sliding lens */
.seg{display:flex;padding:4px;border-radius:99px;position:relative}
.seg button{flex:1;position:relative;z-index:1;font-size:14px;font-weight:550;padding:9px 10px;border-radius:99px;color:var(--fg2);transition:color .3s var(--ease);white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:650}
.lens{position:absolute;top:4px;bottom:4px;left:0;border-radius:99px;z-index:0;background:var(--glass-strong);
  box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 .5px var(--rim),0 4px 14px -4px var(--drop);transition:transform .45s var(--ease),width .45s var(--ease)}
.seg.phase button[aria-pressed="true"]{color:var(--phase)}

/* Timer */
.timer-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;max-width:600px;margin:0 auto}
.timer-main{display:flex;flex-direction:column;align-items:center;gap:22px;min-width:0}
.dial{position:relative;width:min(330px,82vw,46vh);min-width:220px;aspect-ratio:1;border-radius:50%;padding:16px;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.dial .track{stroke:var(--fill)}
.dial .prog{stroke:url(#pg);transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--phase) 55%,transparent))}
.pg1{stop-color:color-mix(in srgb,var(--phase) 70%,#fff);transition:stop-color 1s}
.pg2{stop-color:var(--phase);transition:stop-color 1s}
.knob{fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.phase-pill{font-size:13px;font-weight:650;color:var(--phase);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:6px;transition:color .6s}
.phase-pill i{width:7px;height:7px;border-radius:50%;background:var(--phase);box-shadow:0 0 0 3px color-mix(in srgb,var(--phase) 22%,transparent)}
.running .phase-pill i{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--phase) 0%,transparent)}}
:root[lang="ar"] .phase-pill{letter-spacing:0;text-transform:none;font-size:15px}
.clock{direction:ltr;font-family:var(--font-round);font-size:clamp(58px,17vw,84px);font-weight:250;font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1}
.next{font-size:14px;color:var(--fg2);font-weight:500}
.dial-center .next{max-width:70%;text-align:center;line-height:1.35}
@media (max-width:420px){.dial-center .next{font-size:13px}}
.controls{display:flex;align-items:flex-start;justify-content:center;gap:20px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctl-label{font-size:12px;color:var(--fg2);font-weight:500}
.round{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .25s var(--ease)}
.round:active{transform:scale(.9)}
.round svg{width:22px;height:22px}
.primary{position:relative;min-width:168px;height:62px;border-radius:31px;padding:0 30px;color:var(--on-accent);font-size:19px;font-weight:650;letter-spacing:-.01em;isolation:isolate;
  background:linear-gradient(180deg,color-mix(in srgb,var(--phase) 78%,#fff) 0%,var(--phase) 55%,color-mix(in srgb,var(--phase) 88%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.12),0 10px 26px -6px color-mix(in srgb,var(--phase) 70%,transparent);
  transition:transform .25s var(--ease),box-shadow .4s,background .6s}
.primary::after{content:"";position:absolute;inset:2px 14px auto;height:45%;border-radius:30px 30px 60% 60%;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
.primary:active{transform:scale(.95)}
.primary.paused{color:var(--phase);background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px color-mix(in srgb,var(--phase) 35%,transparent),0 10px 30px -10px var(--drop)}
.primary.paused::after{opacity:.4}
:root[lang="ar"] .primary{letter-spacing:0;font-size:18px}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{border-radius:var(--r-l);padding:16px 18px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h b{font-size:15px;font-weight:650}
.card-h span{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.task-card{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px}
.task-card .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.task-card .k{font-size:12.5px;color:var(--fg2);font-weight:500}
.task-card .v{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:14px;color:var(--fg3);flex:none}

.rhythm{display:flex;gap:4px;height:12px}
.seg-r{position:relative;border-radius:6px;background:var(--fill);overflow:hidden;min-width:6px}
.seg-r i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:inherit;transition:width .4s linear}
.seg-r.f i{background:var(--red)} .seg-r.s i{background:var(--green)} .seg-r.l i{background:var(--indigo)}
.seg-r.cur{box-shadow:0 0 0 2px color-mix(in srgb,var(--phase) 35%,transparent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--fg2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}

.mini{display:flex;align-items:center;gap:16px}
.mini-ring{width:64px;height:64px;flex:none;position:relative}
.mini-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini-ring .c{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-round);font-weight:650;font-size:15px;font-variant-numeric:tabular-nums;direction:ltr}
.mini .facts{display:flex;gap:22px;flex-wrap:wrap}
.num{font-family:var(--font-round);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05}
.num small{font-family:var(--font);font-size:.55em;font-weight:500;color:var(--fg2);letter-spacing:0}
:root[lang="ar"] .num small{font-family:var(--font-ar)}
.fact .num{font-size:24px}
.fact .l{font-size:12.5px;color:var(--fg2);margin-top:2px}

/* Lists (grouped inset, glass) */
.group{display:flex;flex-direction:column;gap:8px}
.group-h{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin:0 18px}
.group-f{font-size:13px;color:var(--fg2);margin:0 18px;line-height:1.45}
:root[lang="ar"] .group-h{text-transform:none;letter-spacing:0;font-size:14px}
.list{border-radius:var(--r-l);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:1px;background:var(--sep)}
.row.ic+.row.ic::before{inset-inline-start:58px}
.row .lbl{flex:1;min-width:0}
.icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.15)}
.icon svg{width:18px;height:18px}
.textbtn{font-size:16px;font-weight:500;color:var(--blue)}
.textbtn.danger{color:var(--red)}

.stepper{display:flex;align-items:center;gap:12px}
.stepper .val{min-width:64px;text-align:end;color:var(--fg2);font-variant-numeric:tabular-nums;font-size:16px}
.step{display:flex;align-items:center;background:var(--fill);border-radius:99px;padding:2px}
.step button{width:40px;height:30px;display:grid;place-items:center;border-radius:99px;transition:background .2s}
.step button:active{background:var(--fill2)}
.step button svg{width:14px;height:14px}
.step span{width:1px;height:16px;background:var(--fg3)}

.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:var(--fill2);position:relative;cursor:pointer;transition:background .3s var(--ease);flex:none;margin:0}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.16),0 1px 1px rgba(0,0,0,.1);transition:transform .35s var(--ease),width .2s}
.switch:active::after{width:34px}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.switch:checked:active::after{transform:translateX(14px)}

.select{position:relative;display:inline-flex;align-items:center}
.select select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--fg2);font-size:16px;padding-block:4px;padding-inline:4px 20px;cursor:pointer;text-align:end}
.select select option{color:#000;background:#fff}
.select::after{content:"";position:absolute;inset-inline-end:3px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.8px solid var(--fg3);border-bottom:1.8px solid var(--fg3);transform:rotate(45deg);pointer-events:none}
input[type=range]{flex:1;min-width:0;accent-color:var(--blue);height:28px}
.seg.small button{font-size:13.5px;padding:7px 10px}
.row .seg{flex:none;min-width:180px;background:var(--fill)}

/* Stats */
.hero{border-radius:var(--r-xl);padding:20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.big-ring{width:116px;height:116px;flex:none;position:relative}
.big-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.big-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr}
.big-ring .c .num{font-size:28px}
.big-ring .c span{font-size:12px;color:var(--fg2)}
.hero .facts{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
.hero .num{font-size:30px}
.hero .l{font-size:13px;color:var(--fg2)}
.goal-chip{align-self:flex-start;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border-radius:var(--r-l);padding:15px 16px}
.tile .l{font-size:13px;color:var(--fg2);font-weight:500}
.tile .num{font-size:28px;margin-top:6px}
.chart{border-radius:var(--r-xl);padding:18px 18px 14px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:156px;align-items:end;position:relative}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bar .b{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;min-height:4px;background:color-mix(in srgb,var(--red) 28%,transparent);transition:height .6s var(--ease)}
.bar.t .b{background:linear-gradient(180deg,color-mix(in srgb,var(--red) 75%,#fff),var(--red));box-shadow:0 6px 16px -6px var(--red)}
.bar .v{font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums;direction:ltr}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fg3);pointer-events:none}
.goal-line span{position:absolute;inset-inline-end:0;top:-19px;font-size:11px;color:var(--fg2)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:8px}
.days span{text-align:center;font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days span.t{color:var(--fg);font-weight:650}
.hist .when{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;border-radius:3px;background:var(--red)}
.empty{color:var(--fg2);font-size:15px;padding:22px 16px;text-align:center}

/* Tasks */
.add{display:flex;gap:10px;align-items:center;border-radius:99px;padding:6px;padding-inline-start:20px}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;padding:9px 0}
.add input::placeholder{color:var(--fg3)}
.est{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--fg2);flex:none}
.est button{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.est button svg{width:12px;height:12px}
.est b{min-width:20px;text-align:center;color:var(--fg);font-variant-numeric:tabular-nums;font-weight:650}
.addbtn{width:42px;height:42px;border-radius:50%;color:#fff;display:grid;place-items:center;flex:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 75%,#fff),var(--blue));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -4px color-mix(in srgb,var(--blue) 60%,transparent);transition:transform .2s var(--ease)}
.addbtn:active{transform:scale(.9)}
.addbtn svg{width:18px;height:18px}
.check{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--fg3);flex:none;display:grid;place-items:center;transition:all .25s var(--ease)}
.check svg{width:14px;height:14px;opacity:0;color:#fff;transform:scale(.5);transition:all .25s var(--ease)}
.task.done .check{background:var(--blue);border-color:var(--blue)}
.task.done .check svg{opacity:1;transform:none}
.task.done .tname{color:var(--fg2);text-decoration:line-through}
.task .tbody{flex:1;min-width:0;text-align:start;display:flex;flex-direction:column;gap:5px;padding:3px 0}
.task.cur{background:color-mix(in srgb,var(--red) 8%,transparent)}
.tname{word-break:break-word;font-weight:500}
.tomatoes{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

.badge{font-size:12px;font-weight:650;color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent);padding:4px 9px;border-radius:99px;flex:none}
.del{color:var(--fg3);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;transition:all .2s}

.del svg{width:15px;height:15px}

/* Tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;padding:5px;border-radius:99px;z-index:20;width:min(440px,calc(100% - 32px))}
.tabbar .lens{top:5px;bottom:5px}
.tabbar.glass{-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border-radius:99px;color:var(--fg);font-size:11px;font-weight:550;transition:color .3s var(--ease)}
.tab svg{width:24px;height:24px;transition:transform .35s var(--ease)}
.tab[aria-selected="true"]{color:var(--blue)}
.tab:active svg{transform:scale(.88)}
:root[lang="ar"] .tab{font-size:11.5px}

/* Banner + alert */
.banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);width:min(440px,calc(100% - 32px));border-radius:26px;padding:12px 16px 12px 12px;display:flex;gap:12px;align-items:center;z-index:30;transition:transform .55s var(--ease);cursor:pointer}
.banner.show{transform:translate(-50%,0)}
.banner .app-ic{width:40px;height:40px;border-radius:10px;flex:none}
.banner b{display:block;font-size:15px;font-weight:650}
.banner span{font-size:14px;color:var(--fg2)}
.banner .btxt{flex:1;min-width:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.alert{border-radius:var(--r-xl);width:min(310px,100%);text-align:center;overflow:hidden;padding:22px 18px 16px}
.alert b{display:block;font-size:17px;font-weight:650}
.alert p{margin:6px 0 18px;font-size:14px;color:var(--fg2)}
.alert .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert .acts button{padding:12px;font-size:16px;font-weight:600;border-radius:99px;background:var(--fill)}
.alert .acts button.destructive{background:var(--red);color:#fff}

@media (min-width:980px){
  .timer-grid{max-width:1040px;grid-template-columns:minmax(0,1fr) 360px;align-items:center;align-content:center;min-height:calc(100% - 20px);column-gap:40px}
  .view#v-timer{display:flex;flex-direction:column}
  .view#v-timer[hidden]{display:none}
  .timer-main{padding-block:10px}
}
@media (max-height:700px){.dial{width:min(280px,78vw,42vh)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}

.mark{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--phase) 78%,#fff),var(--phase));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px -2px var(--drop);transition:background .6s}
.mark svg{width:20px;height:20px}
.mark.big{width:40px;height:40px;border-radius:10px}
.mark.big svg{width:26px;height:26px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--ease)}
.icon-btn:active{transform:scale(.88)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .moon{display:none}
:root.is-dark .icon-btn .sun{display:none}
:root.is-dark .icon-btn .moon{display:block}

/* Shared app bar + page layouts */
.appbar{flex:none;position:relative;z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 2px}
.appbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.view{padding-top:10px}
.page{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-direction:column;padding-bottom:2px}
.stats-grid,.settings-grid,.tasks-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.scol,.tasks-main{display:flex;flex-direction:column;gap:26px;min-width:0}
.tasks-side{min-width:0}
.sum-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.summary .tbar{margin-top:16px}
.sum-note{font-size:12.5px;color:var(--fg2);margin-top:8px}
.about .about-name{font-weight:650}
.about .about-sub{font-size:13px;color:var(--fg2)}
.about-ver{font-size:14px;color:var(--fg2);font-variant-numeric:tabular-nums}
.timer-grid{padding-top:4px}
@media (min-width:980px){
  .page{max-width:1040px}
  .large-title{font-size:38px}
  .stats-grid{grid-template-columns:repeat(12,minmax(0,1fr));column-gap:18px;row-gap:18px}
  .stats-grid .hero{grid-column:span 5;align-self:stretch;flex-direction:column;justify-content:center;text-align:center;gap:18px}
  .stats-grid .hero .facts{align-items:center;flex:none}
  .stats-grid .hero .goal-chip{align-self:center}
  .stats-grid .hero .big-ring{width:136px;height:136px}
  .stats-grid .chart{grid-column:span 7;align-self:stretch;display:flex;flex-direction:column}
  .stats-grid .chart .bars{flex:1;min-height:156px}
  .stats-grid .tiles{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr))}
  #topGroup{grid-column:span 5}
  #recentGroup{grid-column:span 7}
  #recentGroup.wide{grid-column:1/-1}
  .settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
  .tasks-grid{grid-template-columns:minmax(0,1fr) 340px;column-gap:28px}
  .tasks-side{order:0;position:sticky;top:0}
  .timer-grid{min-height:calc(100% - 10px);flex-shrink:0;align-items:start}
  .timer-grid > .col{position:sticky;top:0;align-self:start;min-height:calc(100vh - 210px);justify-content:center}
}

/* Paused-phase marker on the phase switcher */
.seg.phase button.parked::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-inline-start:6px;vertical-align:2px;background:var(--dot)}
.seg.phase button[data-v="focus"]{--dot:var(--red)} .seg.phase button[data-v="short"]{--dot:var(--green)} .seg.phase button[data-v="long"]{--dot:var(--indigo)}

/* Music */
.icon-btn.on{color:var(--phase)}
.m-sub{font-size:12.5px;font-weight:600;color:var(--fg2);margin:2px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--fill);font-size:14px;font-weight:550;color:var(--fg);max-width:100%;transition:background .3s var(--ease),color .3s,box-shadow .3s,transform .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip svg{width:16px;height:16px;flex:none;color:var(--fg2);transition:color .3s}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.on{background:color-mix(in srgb,var(--phase) 15%,transparent);color:var(--phase);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--phase) 38%,transparent)}
.chip.on svg{color:var(--phase)}
.chip.wait{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--phase) 38%,transparent)}
.chip .svc{width:8px;height:8px;border-radius:50%;background:var(--s);flex:none}
.chip .x{width:18px;height:18px;margin-inline:2px -5px;border-radius:50%;display:grid;place-items:center;color:var(--fg3);flex:none}
.chip .x svg{width:10px;height:10px;color:inherit}
.m-row{display:flex;align-items:center;gap:12px;margin-top:12px;min-height:32px}
.m-row > svg{width:18px;height:18px;color:var(--fg2);flex:none}
.m-row .lbl{flex:1;font-size:15px}
.m-sep{height:1px;background:var(--sep);margin:16px 0 12px}
.m-add{display:flex;gap:8px;align-items:center;margin-top:12px;background:var(--fill);border-radius:99px;padding:4px;padding-inline-start:14px}
.m-add input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;padding:8px 0}
.m-add input::placeholder{color:var(--fg3)}
.m-add .addbtn{width:34px;height:34px}
.m-add .addbtn svg{width:15px;height:15px}
.m-err{font-size:13px;color:var(--red);margin-top:8px;line-height:1.4}
.player{margin-top:12px;border-radius:var(--r-m);overflow:hidden;background:var(--fill)}
.player-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;font-size:13.5px;font-weight:600}
.player-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame iframe{display:block;width:100%;border:0}
.m-foot{font-size:12px;color:var(--fg2);margin-top:12px;line-height:1.45}
#wakeVid{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

/* Arabic: same layout as English (no mirroring). Text runs right-to-left inside each element. */

const M = S.music;
let ambOn = false, ambNode = null, ambKind = null, ambGain = null, ambUser = false;
const bufCache = {};
function noiseBuffer(ac, kind){

    for (let i = 0; i < g.length; i++){

      if (kind === 'brown') { last = (last + 0.02*w) / 1.02; g[i] = last * 3.5; }
      else if (kind === 'pink') { b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; g[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }

    for (let i = 0; i < len; i++) d[i] = g[i];
    for (let i = 0; i < fade; i++){ const a = i / fade; d[i] = g[len + i]*(1 - a) + g[i]*a; } // seamless loop

  } else {

    if (!id && !list) return null;

    const src = 'https://www.youtube-nocookie.com/embed/' + (id ? id + '?' + (list ? 'list=' + encodeURIComponent(list) + '&' : '') : 'videoseries?list=' + encodeURIComponent(list) + '&') + q;
    return {svc:'youtube', key:'yt:' + (id || '') + ':' + (list || ''), src, ratio:true, canon:'https://www.youtube.com/watch?' + (id ? 'v=' + id : '') + (list ? (id ? '&' : '') + 'list=' + list : '')};
  }
  if (host === 'open.spotify.com' || host === 'play.spotify.com') {
    m = path.match(/^\/(?:intl-[a-z-]+\/)?(?:embed\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/i);
    if (!m) return null;
    return {svc:'spotify', key:'spotify:' + m[1] + ':' + m[2], src:'https://open.spotify.com/embed/' + m[1] + '/' + m[2], h:152, canon:'https://open.spotify.com/' + m[1] + '/' + m[2]};
  }
  if (host === 'soundcloud.com' || host === 'm.soundcloud.com' || host === 'on.soundcloud.com') {
    if (path.split('/').filter(Boolean).length < 1) return null;
    const clean = 'https://' + (host === 'm.soundcloud.com' ? 'soundcloud.com' : host) + path;
    return {svc:'soundcloud', key:'sc:' + clean, src:'https://w.soundcloud.com/player/?url=' + encodeURIComponent(clean) + '&auto_play=true&visual=false&show_comments=false&hide_related=true', h:166, canon:clean};
  }
  if (host === 'music.apple.com' || host === 'embed.music.apple.com') {
    if (!/\/(album|playlist|station|song|music-video)\//.test(path)) return null;
    const single = u.searchParams.has('i') || /\/(song|station)\//.test(path);
    return {svc:'apple', key:'am:' + path + (u.searchParams.get('i') || ''), src:'https://embed.music.apple.com' + path + u.search, h: single ? 175 : 450, canon:'https://music.apple.com' + path + u.search};
  }
  return null;
}
function stationName(x){ return x.k ? t(x.k) : (x.name || SVC[(parseLink(x.url) || {}).svc || 'youtube'].n); }
let playing = null; // station id currently in the player
const XS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
function renderStations(){
  const all = PRESETS.concat(M.links);
  $('#stChips').innerHTML = all.map(x => {
    const p = parseLink(x.url); if (!p) return '';
    const own = !x.id.startsWith('p-');
    return '<button class="chip' + (playing === x.id ? ' on' : '') + '" data-st="' + esc(x.id) + '" title="' + esc(stationName(x)) + '"><i class="svc" style="--s:' + SVC[p.svc].c + '"></i><span>' + esc(stationName(x)) + '</span>' +
      (own ? '<span class="x" data-del="' + esc(x.id) + '" role="button" aria-label="' + t('removeStation') + '">' + XS + '</span>' : '') + '</button>';
  }).join('');
}
function openStation(x){
  const p = parseLink(x.url); if (!p) return;
  playing = x.id;
  const fr = document.createElement('iframe');
  fr.src = p.src; fr.loading = 'eager'; fr.title = stationName(x);
  fr.allow = 'autoplay; encrypted-media; clipboard-write; fullscreen; picture-in-picture';
  fr.referrerPolicy = 'strict-origin-when-cross-origin';
  fr.setAttribute('allowfullscreen', '');
  if (p.ratio) fr.style.aspectRatio = '16 / 9'; else fr.style.height = p.h + 'px';
  $('#frameBox').replaceChildren(fr);
  $('#playerName').textContent = stationName(x);
  $('#player').hidden = false;
  renderStations(); renderMusic();
}
function closeStation(){ playing = null; $('#frameBox').replaceChildren(); $('#player').hidden = true; renderStations(); renderMusic(); }
$('#playerClose').addEventListener('click', closeStation);
$('#stChips').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); const id = del.dataset.del; M.links = M.links.filter(x => x.id !== id); if (playing === id) closeStation(); save(); renderStations(); return; }
  const b = e.target.closest('[data-st]'); if (!b) return;
  const x = PRESETS.concat(M.links).find(y => y.id === b.dataset.st); if (!x) return;
  if (playing === x.id) closeStation(); else openStation(x);
});
async function fetchTitle(url){
  try {
    const c = new AbortController(); const to = setTimeout(() => c.abort(), 5000);
    const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(url), {signal: c.signal}); clearTimeout(to);
    const j = await r.json(); return j && typeof j.title === 'string' ? j.title.slice(0, 60) : null;
  } catch(e){ return null; }
}
$('#linkForm').addEventListener('submit', async e => {
  e.preventDefault();
  const raw = $('#linkIn').value, p = parseLink(raw), err = $('#linkErr');
  if (!p) { err.textContent = t('badLink'); err.hidden = false; return; }
  err.hidden = true;
  const dup = PRESETS.concat(M.links).find(x => (parseLink(x.url) || {}).key === p.key);
  if (dup) { $('#linkIn').value = ''; openStation(dup); return; }
  const x = {id: 'u' + Date.now().toString(36), url: p.canon || raw.trim(), name: null};
  M.links.push(x); if (M.links.length > 30) M.links.shift();
  $('#linkIn').value = ''; save(); openStation(x);
  const title = await fetchTitle(x.url);
  if (title) { x.name = title; save(); renderStations(); if (playing === x.id) $('#playerName').textContent = title; }
});
$('#linkIn').addEventListener('input', () => { $('#linkErr').hidden = true; });
function renderMusic(){
  $$('#ambChips [data-amb]').forEach(b => {
    const sel = M.amb === b.dataset.amb;
    b.classList.toggle('on', sel && ambOn);
    b.classList.toggle('wait', sel && !ambOn && M.withTimer);
    b.setAttribute('aria-pressed', sel && (ambOn || M.withTimer));
  });
  const parts = [];
  if (M.amb && ambOn) parts.push(t('a_' + M.amb)); else if (M.amb && M.withTimer) parts.push(t('waiting'));
  if (playing) { const x = PRESETS.concat(M.links).find(y => y.id === playing); if (x) parts.push(stationName(x)); }
  $('#musicNow').textContent = parts.length ? parts.join(' · ') : t('off');
  $('#musicBtn').classList.toggle('on', !!(ambOn || playing));
}
$('#musicBtn').addEventListener('click', () => {
  if (curView !== 'timer') showView('timer');
  requestAnimationFrame(() => $('#musicCard').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'}));

/* ---------- Language application ---------- */
function applyLang(){
  const root = document.documentElement, ar = L() === 'ar';
  root.lang = ar ? 'ar' : 'en'; root.dir = 'ltr'; // same layout in every language
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));

  $('#btnReset').setAttribute('aria-label', t('reset')); $('#themeToggle').setAttribute('aria-label', t('themeToggle')); $('#themeToggle').title = t('themeToggle'); $('#btnSkip').setAttribute('aria-label', t('skip'));
  $('#addBtn').setAttribute('aria-label', t('addTask')); $('#estMinus').setAttribute('aria-label', t('fewer')); $('#estPlus').setAttribute('aria-label', t('more'));
  $('#newTask').setAttribute('aria-label', t('newTask')); $('#phaseSeg').setAttribute('aria-label', t('phase'));
  $('#startHint').textContent = touch ? ' ' : t('space');
  $('#dateChip').textContent = new Date().toLocaleDateString(locale() || 'en', {weekday:'short', month:'short', day:'numeric'});
  $('#musicBtn').setAttribute('aria-label', t('music')); $('#musicBtn').title = t('music');
  $('#playerClose').setAttribute('aria-label', t('stopPlayer')); $('#linkAdd').setAttribute('aria-label', t('addStation')); $('#linkIn').setAttribute('aria-label', t('pasteLink'));
  steppers.forEach(f => f());
  renderStations();

}

applyTheme();
if (T.running && Date.now() >= T.endAt) complete(true);
applyLang();

['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => { if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{}); }, {passive:true}));
})();
